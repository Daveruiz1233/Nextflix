name: Build Nextflix Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build Next.js
        run: NEXT_PUBLIC_TMDB_API_KEY="${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}" npm run build
          
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Capacitor Sync
        run: npx cap sync android
        
      - name: Build Android APK (Universal)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nextflix-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build Next.js
        run: NEXT_PUBLIC_TMDB_API_KEY="${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}" npm run build
          
      - name: Capacitor Sync
        run: npx cap sync ios
        
      - name: Build iOS App Bundle (Unsigned)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Building with Workspace..."
            xcodebuild -workspace ios/App/App.xcworkspace \
                       -scheme App \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          else
            echo "Building with Project..."
            xcodebuild -project ios/App/App.xcodeproj \
                       -scheme App \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          fi
                     
      - name: Package IPA (Unsigned)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r Nextflix-Unsigned.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nextflix-unsigned.ipa
          path: Nextflix-Unsigned.ipa

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nextflix-debug.apk
          
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: nextflix-unsigned.ipa
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nextflix Shield v1.1.3-RETRO
          body: |
            ## 🛡️ Nextflix Shield: The Mobile Firewall
            This pre-release introduces the **Redirect Killer** system, designed to make streaming as clean and secure as possible on mobile devices.
            
            ### ✨ What's New
            - **Native Redirect Killer (iOS/Android)**: Built-in native firewall that kills unauthorized navigations at the OS level before they even load.
            - **Premium UI Refinements**:
              - Fixed Hero banner overlap issues on mobile.
              - Polished Season Picker with improved visibility and glassmorphism.
              - Optimized spacing for better handling on smaller screens (iPhone 6s Plus compatible).
            - **Stealth Mode**: Improved ad-blocker stealth to bypass common "AdBlock detected" popups.
            
            ### 🏗️ Technical Improvements
            - Faster Service Worker navigation interception.
            - Resolved module resolution issues for smoother IDE development.
            - Inline secret injection for safer builds.
            
            ### 📦 Artifacts
            - `app-debug.apk`: Universal Android build (Unsigned).
            - `Nextflix-Unsigned.ipa`: Unsigned iOS build for sideloading.
            
            *Note: This is a beta pre-release for testing and educational purposes.*
          files: |
            app-debug.apk
            Nextflix-Unsigned.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
