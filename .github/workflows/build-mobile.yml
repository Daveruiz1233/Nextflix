name: Build Nextflix Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Compile AdGuard Filter (Bloom + Native Rules)
        # Downloads AdGuard Base, Mobile, Tracking, Annoyances, EasyList, EasyPrivacy
        # Compiles into filter.bin (Service Worker) + adblock-rules.json (Native)
        # Filter lists are CC BY-SA 4.0 open-source — free to use
        run: node scripts/update-filters.mjs && node scripts/generate-native-rules.mjs

      - name: Build Next.js (Webpack — Legacy Compat)
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_BASE_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
        # --webpack forces legacy Webpack instead of Turbopack
        # Turbopack outputs globalThis/arrow-fns that break old iOS WebKit (iPhone 6s Plus)
        run: npx next build --webpack

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Capacitor Sync
        run: npx cap sync android
        
      - name: Build Android APK (Universal)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nextflix-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Compile AdGuard Filter (Bloom + Native Rules)
        run: node scripts/update-filters.mjs && node scripts/generate-native-rules.mjs

      - name: Build Next.js (Webpack — Legacy Compat)
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_BASE_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
        run: npx next build --webpack
          
      - name: Capacitor Sync
        run: npx cap sync ios
        
      - name: Build iOS App Bundle (Unsigned)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Building with Workspace..."
            xcodebuild -workspace ios/App/App.xcworkspace \
                       -scheme App \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          else
            echo "Building with Project..."
            xcodebuild -project ios/App/App.xcodeproj \
                       -scheme App \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          fi
                     
      - name: Package IPA (Unsigned)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r Nextflix-Unsigned.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nextflix-unsigned.ipa
          path: Nextflix-Unsigned.ipa

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nextflix-debug.apk
          
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: nextflix-unsigned.ipa
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Nextflix Shield v3.0 — Nuclear Isolation
          body: |
            ## 🛡️ Nextflix Shield v3.0 — THE NUCLEAR UPDATE

            ### 🆕 What's New: Zero-Collision Isolation
            This version completely isolates the security shield from the Capacitor bridge.

            | Feature | Status | Benefit |
            |---|---|---|
            | **Zero-Collision** | ✅ Active | Fixes RETRO_ERR / Red Banner Error |
            | **Native Player Force** | ✅ Active | Keeps subtitles/quality settings on iOS |
            | **Shield Pulse** | ✅ Active | Premium visual feedback for intrusions |
            | **Hardening** | ✅ Active | Expands blocklist to vidlink.pro/stream.ad |

            ### 🔧 Security Layers (v3 Architecture)
            1. **Strict Origin Isolation** — Block scripts exit main frame to prevent bridge collision.
            2. **Inline Media Force** — Native iOS/Android override to prevent browser hijacking.
            3. **MutationObserver v2** — Real-time DOM scanning for ad-injected meta-refresh tags.
            4. **Service Worker Edge** — 185k+ domains blocked with hardcoded high-priority additions.

            ### ✅ Compatibility
            - iOS 12+ (iPhone 6s Plus and newer)
            - All Android versions supported by Capacitor
            - Webpack build (no Turbopack — ES5 compatible)

            *Educational/personal use only.*
          files: |
            app-debug.apk
            Nextflix-Unsigned.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
