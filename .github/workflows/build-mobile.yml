name: Build Nextflix Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Compile AdGuard Filter (Bloom + Native Rules)
        # Downloads AdGuard Base, Mobile, Tracking, Annoyances, EasyList, EasyPrivacy
        # Compiles into filter.bin (Service Worker) + adblock-rules.json (Native)
        # Filter lists are CC BY-SA 4.0 open-source — free to use
        run: node scripts/update-filters.mjs && node scripts/generate-native-rules.mjs

      - name: Build Next.js (Webpack — Legacy Compat)
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_BASE_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
        # --webpack forces legacy Webpack instead of Turbopack
        # Turbopack outputs globalThis/arrow-fns that break old iOS WebKit (iPhone 6s Plus)
        run: npx next build --webpack

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Capacitor Sync
        run: npx cap sync android
        
      - name: Build Android APK (Universal)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nextflix-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Compile AdGuard Filter (Bloom + Native Rules)
        run: node scripts/update-filters.mjs && node scripts/generate-native-rules.mjs

      - name: Build Next.js (Webpack — Legacy Compat)
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_BASE_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
        run: npx next build --webpack
          
      - name: Capacitor Sync
        run: npx cap sync ios
        
      - name: Build iOS App Bundle (Unsigned)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Building with Workspace..."
            xcodebuild -workspace ios/App/App.xcworkspace \
                       -scheme App \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          else
            echo "Building with Project..."
            xcodebuild -project ios/App/App.xcodeproj \
                       -scheme App \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          fi
                     
      - name: Package IPA (Unsigned)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r Nextflix-Unsigned.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nextflix-unsigned.ipa
          path: Nextflix-Unsigned.ipa

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nextflix-debug.apk
          
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: nextflix-unsigned.ipa
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nextflix Shield v1.1.6 — Iron Dome (Nuclear Shield v3)
          body: |
            ## 🛡️ Nextflix Shield v1.1.6 — Iron Dome (v3.0)

            ### 🆕 What's New: Nuclear Shield v3 & Subtitle Bridge
            This is a major architectural hardening update focused on total redirect prevention and native player parity.

            - **Global Safari Lock**: Implementation of the "Nuclear Option." Native-level blocking of `window.open` at the kernel level. Safari will **NEVER** launch unexpectedly.
            - **Iron Dome Injection**: Shield JS is now injected into **EVERY FRAME** (main + all iframes) with aggressive 15% progress re-evaluation.
            - **Subtitle Bridge**: Automatic detection and injection of VidSrc subtitles into the native iOS AVKit/Android Media3 controls. No more missing subtitles in fullscreen!
            - **Premium Aesthetics**: Upgraded "Theater Mode" with glowing focus effects and a real-time "Ad-Loops Killed" counter.

            ### 🛡️ Filter Engine Updates (185,660 domains)
            | Filter | Domains | Blocks |
            |---|---|---|
            | AdGuard Base | ~65,591 | Display ads, banners, ad scripts |
            | AdGuard Mobile Ads | ~1,023 | Mobile-specific ad SDKs |
            | AdGuard Tracking | ~85,184 | Analytics, fingerprinting, trackers |
            | AdGuard Annoyances | ~1,033 | Popups, cookie notices, redirects |
            | AdGuard DNS Filter | ~161,288 | DNS-level comprehensive list |
            | EasyList | ~56,027 | Community standard blocklist |
            | EasyPrivacy | ~46,819 | Privacy protection |
            | **TOTAL** | **185,660+** | 🛡️ AdGuard-grade protection |

            ### 🔧 Security Layers (4-Tier Defense)
            1. **Native OS Filter** — CPU-level blocking of `window.open` requests.
            2. **Network Interceptor** — `shouldInterceptRequest` kills ads before they reach the browser byte-stream.
            3. **Service Worker** — Bloom-filter based blocking with O(1) latency.
            4. **Iron Dome JS** — Global `location.href` proxying inside every iframe.

            ### ✅ Compatibility
            - iOS 12+ (iPhone 6s Plus and newer)
            - All Android versions supported by Capacitor
            - Webpack build (Legacy ES5 compatible)

            *Educational/personal use only.*
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            Nextflix-Unsigned.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
