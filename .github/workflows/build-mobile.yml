name: Build Nextflix Mobile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Compile AdGuard Filter (Bloom + Native Rules)
        # Downloads AdGuard Base, Mobile, Tracking, Annoyances, EasyList, EasyPrivacy
        # Compiles into filter.bin (Service Worker) + adblock-rules.json (Native)
        # Filter lists are CC BY-SA 4.0 open-source — free to use
        run: node scripts/update-filters.mjs && node scripts/generate-native-rules.mjs

      - name: Build Next.js (Webpack — Legacy Compat)
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_BASE_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
        # --webpack forces legacy Webpack instead of Turbopack
        # Turbopack outputs globalThis/arrow-fns that break old iOS WebKit (iPhone 6s Plus)
        run: npx next build --webpack

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Capacitor Sync
        run: npx cap sync android
        
      - name: Build Android APK (Universal)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nextflix-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Compile AdGuard Filter (Bloom + Native Rules)
        run: node scripts/update-filters.mjs && node scripts/generate-native-rules.mjs

      - name: Build Next.js (Webpack — Legacy Compat)
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_TMDB_BASE_URL: https://api.themoviedb.org/3
          NEXT_PUBLIC_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
        run: npx next build --webpack
          
      - name: Capacitor Sync
        run: npx cap sync ios
        
      - name: Build iOS App Bundle (Unsigned)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "Building with Workspace..."
            xcodebuild -workspace ios/App/App.xcworkspace \
                       -scheme App \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          else
            echo "Building with Project..."
            xcodebuild -project ios/App/App.xcodeproj \
                       -scheme App \
                       -configuration Debug \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO
          fi
                     
      - name: Package IPA (Unsigned)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r Nextflix-Unsigned.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: nextflix-unsigned.ipa
          path: Nextflix-Unsigned.ipa

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nextflix-debug.apk
          
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: nextflix-unsigned.ipa
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.8
          name: Nextflix Intelligence Shield v4.0 (Selective Proxy)
          body: |
            ## 🛡️ Nextflix Intelligence Shield v4.0 — AdGuard Parity
            
            ### 🆕 What's New: Intelligence over Force
            This major release fixes the "Locked Player" issue by moving from a "Nuclear" blanket-block to a "Selective Proxy" model inspired by the AdGuard browser extension.

            - **Intelligence Shield v4**: Replaces aggressive global blocking with selective proxying. Player controls (Pause, Play, Quality, Server Switch) are now fully interactive.
            - **Decoy Window Factory**: Tricks ad-scripts into thinking they opened a popup by returning a fake "Decoy Window" object. This prevents player freezes and crashes.
            - **Filter-Driven Logic**: Utilizes a new `popup-rules.json` engine containing 4,000+ specialized popup source domains extracted from AdGuard Annoyances list.
            - **Selective Click Interception**: Only blocks clicks on elements explicitly trying to escape the player's environment. Touch/mousedown events are now ignored by the shield.
            - **Native Subtitle Sync**: Improved Subtitle Bridge ensuring all VidSrc tracks are available in the native iOS/Android system player.

            ### 🛡️ Filter Engine Updates (185,736 domains)
            | Filter | Domains | Blocks |
            |---|---|---|
            | AdGuard Base | ~65,655 | General web ads |
            | AdGuard Mobile | ~1,023 | Mobile app SDK ads |
            | **AdGuard Popup Rules** | **~4,061** | **Active popup sources** |
            | **TOTAL** | **185,736+** | 🛡️ AdGuard-grade protection |

            ### 🔧 5-Layer Intelligence Defense
            1. **Decoy Factory** — Neutrals popups without crashing scripts.
            2. **Selective window.open** — Blocks ad-domains, allows internal/safe domains.
            3. **NativeOS Content Blockers** — 45k high-priority network rules.
            4. **Service Worker** — 185k domain filter in binary Bloom format.
            5. **MutationObserver** — Kills hidden ad iframes & meta-refresh redirects.

            ### ✅ Compatibility
            - iOS 12+ (Compatible with older iPhones)
            - Android 8+
            - Supports all major VidSrc servers (vidsrc.to, .me, .xyz, etc.)

            *Educational/personal use only.*
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            Nextflix-Unsigned.ipa
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
